name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Tags are needed by `make build`: without them the injected version
          # degrades to a short SHA and the build-info e2e assertion is weaker.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: true

      - name: Download dependencies
        run: go mod download

      # windows-latest has no GNU make: the image ships MSYS2 but explicitly
      # keeps it off PATH, and the Makefile also assumes SHELL=/bin/bash plus
      # POSIX find/date. So the three make-driven steps are mirrored with their
      # direct Go equivalents on Windows only. Keep both halves in sync.
      - name: Check formatting
        if: matrix.os != 'windows-latest'
        run: make fmt-check

      - name: Check formatting (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "Not gofmt-clean:"; echo "$out"; exit 1; fi

      - name: Run go vet
        if: matrix.os != 'windows-latest'
        run: make vet

      - name: Run go vet (Windows)
        if: matrix.os == 'windows-latest'
        run: go vet ./...

      - name: Build binary for e2e tests
        # `make build` (not a bare `go build`): the e2e suite asserts that the
        # -ldflags build info reaches the binary.
        if: matrix.os != 'windows-latest'
        run: make build

      - name: Build binary for e2e tests (Windows)
        # Mirrors the Makefile LDFLAGS; TestCLIVersionReportsInjectedBuildInfo
        # fails if any -X is missing. The .exe suffix is required: the e2e tests
        # exec the extensionless build/shotgun-cli path, which os/exec resolves
        # through PATHEXT on Windows.
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          pkg=github.com/quantmind-br/shotgun-cli/cmd
          ver="$(git describe --tags --abbrev=0 2>/dev/null || git rev-parse --short HEAD)"
          go build -ldflags "-s -w \
            -X $pkg.version=$ver \
            -X $pkg.commit=$(git rev-parse --short HEAD) \
            -X $pkg.date=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -X $pkg.builtBy=make" \
            -o build/shotgun-cli.exe .

      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Only TestWizardClipboardCopyCmd is skipped: it needs a clipboard
          # utility the runner does not have. The coordinator tests used to be
          # skipped here because their unsynchronised field access tripped the
          # race detector; that cause is gone.
          go test -v -race -covermode=atomic -coverprofile=coverage.out -skip "TestWizardClipboardCopyCmd" ./...

      - name: Run tests
        # No -race and no coverage off Linux: race adds ~2x runtime for a signal
        # the Linux run already provides, and only Linux feeds Codecov.
        if: matrix.os != 'ubuntu-latest'
        run: go test -v -skip "TestWizardClipboardCopyCmd" ./...

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true

      - name: Check coverage threshold
        # Stays Linux-only: coverage.out is produced only there, and the script
        # needs `bc`, which windows-latest does not have.
        if: matrix.os == 'ubuntu-latest'
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          echo "Total coverage: ${COVERAGE}%"

          # Fail if coverage is below 80% (some tests skipped in CI due to env limitations)
          THRESHOLD=80
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi
          echo "Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: true

      # v8 is required: earlier majors drive golangci-lint with v1-only flags
      # and reject the v2 schema in .golangci.yml.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: true

      - name: Build
        run: go build -v ./...
